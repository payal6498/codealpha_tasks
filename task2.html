<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .container {
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        #taskInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        #addBtn {
            width: 100%;
            padding: 10px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #addBtn:hover {
            background: #019474;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f8f8f8;
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li.completed {
            text-decoration: line-through;
            color: gray;
        }

        button {
            margin-left: 5px;
            padding: 5px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .editBtn { background: #0984e3; color: white; }
        .deleteBtn { background: #d63031; color: white; }
        .completeBtn { background: #55efc4; }
    </style>
</head>

<body>

    <div class="container">
        <h2>To-Do List</h2>

        <input type="text" id="taskInput" placeholder="Enter task...">
        <button id="addBtn">Add Task</button>

        <ul id="taskList"></ul>
    </div>

    <script>
        const input = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");

        // Load saved tasks
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function displayTasks() {
            taskList.innerHTML = "";

            tasks.forEach((task, index) => {
                let li = document.createElement("li");
                li.className = task.completed ? "completed" : "";

                li.innerHTML = `
                    <span>${task.text}</span>
                    <div>
                        <button class="completeBtn" onclick="toggleComplete(${index})">✔</button>
                        <button class="editBtn" onclick="editTask(${index})">✎</button>
                        <button class="deleteBtn" onclick="deleteTask(${index})">🗑</button>
                    </div>
                `;

                taskList.appendChild(li);
            });
        }

        function addTask() {
            if (input.value.trim() === "") return alert("Enter a task!");

            tasks.push({ text: input.value, completed: false });
            input.value = "";
            saveTasks();
            displayTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            displayTasks();
        }

        function editTask(index) {
            let newTask = prompt("Edit task:", tasks[index].text);
            if (newTask !== null && newTask.trim() !== "") {
                tasks[index].text = newTask;
                saveTasks();
                displayTasks();
            }
        }

        function toggleComplete(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            displayTasks();
        }

        addBtn.addEventListener("click", addTask);

        // Show tasks on page load
        displayTasks();
    </script>

</body>
</html>
